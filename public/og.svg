<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#16191e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(80, 90)">
    <rect width="60" height="60" rx="14" fill="#7c5cff"/>
    <text x="30" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#ffffff">M</text>
    <circle cx="56" cy="6" r="6" fill="#7c5cff" stroke="#0b0d10" stroke-width="3"/>
    <text x="84" y="30" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">MukiSoft</text>
    <text x="84" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="2">TECHNOLOGY</text>
  </g>
  <g transform="translate(80, 220)">
    <text font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff">
      <tspan x="0" y="60">Technology that turns ideas</tspan>
      <tspan x="0" y="130">into digital products.</tspan>
    </text>
    <text x="0" y="190" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.7)">Software · AI · Web · Mobile · SaaS · Design</text>
  </g>
  <g transform="translate(80, 520)">
    <rect width="220" height="56" rx="28" fill="#ffffff"/>
    <text x="110" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0b0d10">Start a Project →</text>
  </g>
